<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Topper Stitching - Owner Dashboard</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin: 10px; }
    .accept { background: #28a745; color: white; }
    .reject { background: #dc3545; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>Topper Stitching Support</h2>
  <p id="status">कनेक्ट हो रहा है...</p>
  
  <div id="incomingCall" style="display:none;">
    <p><strong>📞 ग्राहक का कॉल आ रहा है!</strong></p>
    <button class="accept" onclick="acceptCall()">कॉल उठाएँ (Accept)</button>
    <button class="reject" onclick="rejectCall()">काटें (Reject)</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<!-- रिंगटोन के लिए ऑडियो (बेसिक बीप सायरन) -->
<audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

<script>
  const peer = new Peer('topper-stitching-owner');
  let currentCall = null;
  const ringtone = document.getElementById('ringtone');

  peer.on('open', (id) => {
    document.getElementById('status').innerText = 'ऑनलाइन हैं, कॉल का इंतज़ार है...';
  });

  peer.on('call', (call) => {
    currentCall = call;
    document.getElementById('incomingCall').style.display = 'block';
    document.getElementById('status').innerText = 'इनकमिंग कॉल बज रही है!';
    
    // घंटी बजाना शुरू करें
    ringtone.play().catch(e => console.log("Audio play error:", e));
  });

  function acceptCall() {
    ringtone.pause();
    ringtone.currentTime = 0;
    
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      currentCall.answer(stream);
      currentCall.on('stream', (remoteStream) => {
        document.getElementById('remoteAudio').srcObject = remoteStream;
      });
      document.getElementById('incomingCall').style.display = 'none';
      document.getElementById('status').innerText = 'कॉल कनेक्ट हो गई है 🟢';
    });
  }

  function rejectCall() {
    ringtone.pause();
    ringtone.currentTime = 0;
    
    if (currentCall) currentCall.close();
    document.getElementById('incomingCall').style.display = 'none';
    document.getElementById('status').innerText = 'ऑनलाइन हैं, कॉल का इंतज़ार है...';
  }
</script>

</body>
</html>
